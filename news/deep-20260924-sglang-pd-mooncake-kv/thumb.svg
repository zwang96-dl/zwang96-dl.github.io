<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="860" height="400" rx="12" fill="#ffffff"/>
  <defs>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#ef4444" stroke-width="1.6"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#16a34a" stroke-width="1.6"/>
    </marker>
  </defs>

  <!-- 修复前 -->
  <text x="24" y="36" font-size="17" font-weight="700" fill="#b91c1c">修复前：搬运工不等算完就动手</text>

  <g font-size="14" fill="#1f2937" text-anchor="middle">
    <rect x="24" y="56" width="168" height="66" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="108" y="82"><tspan x="108" dy="0">forward_stream</tspan><tspan x="108" dy="20">写 chunk N 的 KV 页</tspan></text>

    <rect x="242" y="56" width="168" height="66" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="326" y="82"><tspan x="326" dy="0">transfer worker</tspan><tspan x="326" dy="20">直接 RDMA 读走</tspan></text>

    <rect x="460" y="56" width="168" height="66" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
    <text x="544" y="82"><tspan x="544" dy="0">decode 拿到</tspan><tspan x="544" dy="20">半成品 KV</tspan></text>

    <rect x="678" y="56" width="158" height="66" rx="8" fill="#fecaca" stroke="#b91c1c" stroke-width="2"/>
    <text x="757" y="82" font-weight="700" fill="#991b1b"><tspan x="757" dy="0">输出悄悄变错</tspan><tspan x="757" dy="20">不报错 ✗</tspan></text>

    <line x1="192" y1="89" x2="236" y2="89" stroke="#ef4444" stroke-width="1.6" marker-end="url(#arrR)" stroke-dasharray="5,4"/>
    <text x="214" y="78" font-size="12" fill="#b91c1c">不等 event</text>
    <line x1="410" y1="89" x2="454" y2="89" stroke="#ef4444" stroke-width="1.6" marker-end="url(#arrR)"/>
    <line x1="628" y1="89" x2="672" y2="89" stroke="#ef4444" stroke-width="1.6" marker-end="url(#arrR)"/>
  </g>

  <!-- 分隔 -->
  <line x1="24" y1="158" x2="836" y2="158" stroke="#e5e7eb" stroke-width="1"/>

  <!-- 修复后 -->
  <text x="24" y="192" font-size="17" font-weight="700" fill="#15803d">修复后：等 event 变绿再传</text>

  <g font-size="14" fill="#1f2937" text-anchor="middle">
    <rect x="24" y="212" width="168" height="66" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="108" y="238"><tspan x="108" dy="0">forward_stream</tspan><tspan x="108" dy="20">写完记 event</tspan></text>

    <rect x="242" y="212" width="168" height="66" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="326" y="238"><tspan x="326" dy="0">transfer worker</tspan><tspan x="326" dy="20">synchronize 后再读</tspan></text>

    <rect x="460" y="212" width="168" height="66" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="544" y="238"><tspan x="544" dy="0">decode 拿到</tspan><tspan x="544" dy="20">完整 KV</tspan></text>

    <rect x="678" y="212" width="158" height="66" rx="8" fill="#bbf7d0" stroke="#15803d" stroke-width="2"/>
    <text x="757" y="238" font-weight="700" fill="#166534"><tspan x="757" dy="0">输出正常</tspan><tspan x="757" dy="20">✓</tspan></text>

    <line x1="192" y1="245" x2="236" y2="245" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arrG)"/>
    <text x="214" y="234" font-size="12" fill="#15803d">等 event</text>
    <line x1="410" y1="245" x2="454" y2="245" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arrG)"/>
    <line x1="628" y1="245" x2="672" y2="245" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arrG)"/>
  </g>

  <text x="24" y="330" font-size="13" fill="#6b7280">三处修复缺一不可：TransferKVChunk 加 wait_event 字段 → mooncake conn 透传并在读前 synchronize → prefill overlap 路径补记 event</text>
  <text x="24" y="356" font-size="13" fill="#6b7280">触发条件：SGLang P/D 解耦 + mooncake 传输 + chunked prefill + overlap 调度，四条全中才中招</text>
  <text x="24" y="382" font-size="12" fill="#9ca3af">按 AMD infera 补丁文档描述绘制 · 验证环境：2×8×MI325X，ROCm 7.2.0，sglang v0.5.16</text>
</svg>
