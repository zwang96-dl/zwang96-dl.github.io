<svg xmlns="http://www.w3.org/2000/svg" width="680" height="360" viewBox="0 0 680 360" font-family="-apple-system,PingFang SC,Microsoft YaHei,sans-serif">
<rect x="0" y="0" width="680" height="360" fill="#ffffff" rx="8"/>
<text x="340" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">投机解码部署架构（据原文 ASCII 图重绘）</text>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#666"/></marker></defs>
<g font-size="14">
<rect x="30" y="60" width="180" height="64" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
<text x="120" y="86" text-anchor="middle" font-weight="bold" fill="#1a73e8">草稿模型 Draft (2B)</text>
<text x="120" y="108" text-anchor="middle" font-size="12" fill="#444">小模型先猜 k 个 token</text>
<rect x="470" y="60" width="180" height="64" rx="8" fill="#fef7e0" stroke="#f9ab00" stroke-width="2"/>
<text x="560" y="86" text-anchor="middle" font-weight="bold" fill="#b26a00">Token 缓冲区</text>
<text x="560" y="108" text-anchor="middle" font-size="12" fill="#444">攒起 k 个猜测</text>
<line x1="210" y1="92" x2="455" y2="92" stroke="#666" stroke-width="2" marker-end="url(#arr)"/>
<rect x="30" y="180" width="180" height="64" rx="8" fill="#fce8e6" stroke="#d93025" stroke-width="2"/>
<text x="120" y="206" text-anchor="middle" font-weight="bold" fill="#d93025">验证器 Verifier (70B)</text>
<text x="120" y="228" text-anchor="middle" font-size="12" fill="#444">大模型一次验算</text>
<rect x="470" y="180" width="180" height="64" rx="8" fill="#e6f4ea" stroke="#188038" stroke-width="2"/>
<text x="560" y="206" text-anchor="middle" font-weight="bold" fill="#188038">接受逻辑</text>
<text x="560" y="228" text-anchor="middle" font-size="12" fill="#444">置信度阈值 0.95 / 0.80</text>
<line x1="120" y1="124" x2="120" y2="170" stroke="#666" stroke-width="2" marker-end="url(#arr)"/>
<line x1="560" y1="124" x2="560" y2="170" stroke="#666" stroke-width="2" marker-end="url(#arr)"/>
<rect x="220" y="290" width="240" height="48" rx="24" fill="#f1f3f4" stroke="#444" stroke-width="2"/>
<text x="340" y="319" text-anchor="middle" font-weight="bold" font-size="15" fill="#111">输出流（最终 token）</text>
<line x1="120" y1="244" x2="296" y2="288" stroke="#666" stroke-width="2" marker-end="url(#arr)"/>
<line x1="560" y1="244" x2="384" y2="288" stroke="#666" stroke-width="2" marker-end="url(#arr)"/>
<text x="120" y="264" text-anchor="middle" font-size="11" fill="#888">拒绝→从该位重算</text>
</g></svg>